<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analysis - Norcanto AI</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/assets/norcanto_logo.png">
  <link rel="stylesheet" href="/css/design-system.css">
  <link rel="stylesheet" href="/css/nav.css">
  <link rel="stylesheet" href="/css/app.css">
  <style>
    /* Mobile analysis tweaks */
    @media (max-width:600px) {
      .doc-tags-row { flex-wrap:wrap; gap:6px; }
      .insight-list-item { font-size:12px; }
      .insight-content { font-size:13px; }
    }
  </style>
</head>
<body>

<nav class="nav scrolled" id="main-nav">
  <div class="nav-inner">
    <a href="/pages/app.html" class="nav-logo" style="gap:var(--space-2)">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15" style="color:var(--text-muted);flex-shrink:0"><polyline points="15 18 9 12 15 6"/></svg>
      <div class="nav-logo-icon"><img src="/assets/norcanto_logo.png" alt="Norcanto" width="28" height="28"></div>
      <div class="nav-logo-wordmark" style="font-size:14px">Norcanto AI</div>
    </a>
    <div style="flex:1"></div>
    <div class="nav-actions" style="gap:var(--space-2)">
      <button class="btn btn-ghost btn-sm" id="export-btn" style="display:none">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="13" height="13"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <span class="hide-xs">Export</span>
      </button>
      <a href="/pages/app.html" class="btn btn-secondary btn-sm">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="13" height="13"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <span class="hide-xs">Dashboard</span>
      </a>
    </div>
  </div>
</nav>

<div style="padding-top:var(--nav-height)">
  <div class="analysis-mobile-tabs">
    <button class="active" id="show-analysis-tab">Analysis</button>
    <button id="show-chat-tab">Chat</button>
  </div>

  <!-- Loading -->
  <div id="loading-state" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - var(--nav-height));gap:var(--space-4);padding:var(--space-8)">
    <div style="width:44px;height:44px;border:3px solid var(--brand-border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite"></div>
    <div style="font-size:14px;color:var(--text-secondary)" id="loading-label">Loading analysis...</div>
  </div>

  <!-- Error -->
  <div id="error-state" style="display:none;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - var(--nav-height));gap:var(--space-4);text-align:center;padding:var(--space-8)">
    <div class="empty-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div>
    <div class="empty-title" id="error-title">Document not found</div>
    <div class="empty-desc" id="error-desc">This document may have been deleted or the link is invalid.</div>
    <a href="/pages/app.html" class="btn btn-primary">Back to Dashboard</a>
  </div>

  <!-- Analysis view -->
  <div class="analysis-layout" id="analysis-view" style="display:none">

    <!-- Left: analysis content -->
    <div class="analysis-main" id="analysis-main">
      <div class="analysis-header" style="margin-bottom:var(--space-6)">
        <div class="analysis-doc-info">
          <div class="analysis-doc-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          </div>
          <div style="min-width:0">
            <div class="analysis-doc-name" id="doc-name">Document</div>
            <div class="analysis-doc-meta" id="doc-meta"></div>
          </div>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:var(--space-2);margin-top:var(--space-3)" id="doc-tags"></div>
        <div class="analysis-tools">
          <button class="btn btn-secondary btn-sm" id="rename-btn">Rename</button>
          <button class="btn btn-secondary btn-sm" id="copy-report-btn">Copy report</button>
          <button class="btn btn-secondary btn-sm" id="pdf-export-btn">Save PDF</button>
          <button class="btn btn-secondary btn-sm" id="word-export-btn">Export Word</button>
          <button class="btn btn-secondary btn-sm" id="share-btn">Share link</button>
        </div>
      </div>
      <nav class="analysis-toc" id="analysis-toc" aria-label="Analysis sections"></nav>
      <section class="notes-panel">
        <div class="insight-section-header"><div class="insight-section-title">Notes</div></div>
        <textarea id="document-notes" placeholder="Add private notes about this document..." aria-label="Document notes"></textarea>
      </section>
      <div id="analysis-sections"></div>
    </div>

    <!-- Right: chat -->
    <div class="analysis-sidebar">
      <div class="chat-header">
        <div style="width:26px;height:26px;border-radius:6px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="var(--brand-black)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="13" height="13"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </div>
        <div class="chat-title">Ask the Document</div>
      </div>
      <div class="chat-messages" id="chat-messages">
        <div class="chat-msg ai">
          <div class="chat-avatar ai">AI</div>
          <div><div class="chat-bubble">Document analyzed. Ask me anything about its content, obligations, risks, or any specific section.</div></div>
        </div>
      </div>
      <div class="chat-input-area">
        <div class="chat-suggestions" id="chat-suggestions"></div>
        <div class="chat-input-row">
          <textarea id="chat-input" placeholder="Ask anything about this document..." rows="1" aria-label="Chat message"></textarea>
          <button class="chat-send-btn" id="chat-send" aria-label="Send">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/js/auth.js"></script>
<script>
'use strict';

const STORAGE_KEY = 'qd_documents';
let currentDoc    = null;
let chatHistory   = [];
const safe = (value) => window.Norcanto?.escapeHTML(value) || String(value || '');

// ── Load document from localStorage ────────────────────────────────────────────
const getDocId = () => {
  try {
    const params = new URLSearchParams(window.location.search);
    return decodeURIComponent(params.get('id') || '');
  } catch { return ''; }
};

const loadDoc = (id) => {
  try {
    const docs = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    return docs.find(d => d.id === id) || JSON.parse(sessionStorage.getItem('norcanto_cloud_doc') || 'null');
  } catch { return null; }
};
const persistDocument = async () => {
  if (!currentDoc) return;
  currentDoc.notes = document.getElementById('document-notes')?.value || currentDoc.notes || '';
  currentDoc.chatHistory = chatHistory;
  const metadata = { notes:currentDoc.notes, chatHistory, completedActions:currentDoc.completedActions || [] };
  if (currentDoc.storage === 'cloud') {
    await QDAuth.authFetch('/api/documents',{method:'PATCH',body:JSON.stringify({id:currentDoc.id,title:currentDoc.name,metadata})}).catch(()=>{});
    sessionStorage.setItem('norcanto_cloud_doc',JSON.stringify(currentDoc));
  } else {
    const docs=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]').map(doc=>doc.id===currentDoc.id?{...doc,...currentDoc}:doc);
    localStorage.setItem(STORAGE_KEY,JSON.stringify(docs));
  }
};

// ── Section rendering helpers ───────────────────────────────────────────────────
const ic = (path) => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${path}</svg>`;

const ICONS = {
  summary:     '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>',
  plain:       '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  insights:    '<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>',
  risk:        '<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>',
  dates:       '<rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>',
  obligations: '<polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
  actions:     '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
  questions:   '<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/>',
};

const severityColor = { high:'var(--danger)', medium:'var(--warning)', low:'var(--success)' };
const priorityColor = { high:'var(--danger)', medium:'var(--warning)', low:'var(--success)' };
const urgencyColor  = { high:'var(--danger)', medium:'var(--warning)', low:'var(--info)' };

const sectionHeader = (title, iconKey) => `
  <div class="insight-section-header">
    <div class="insight-section-icon">${ic(ICONS[iconKey] || ICONS.summary)}</div>
    <div class="insight-section-title">${title}</div>
    <div class="section-actions"><button class="section-action copy-section" aria-label="Copy ${title}">⧉</button><button class="section-action collapse-section" aria-label="Collapse ${title}" aria-expanded="true">⌃</button></div>
  </div>`;

const renderAnalysis = (a) => {
  let html = '';

  // Summary
  if (a.executive_summary) {
    html += `<div class="insight-section">${sectionHeader('Executive Summary','summary')}
      <div class="insight-content">${safe(a.executive_summary)}</div></div>`;
  }

  // Plain language
  if (a.plain_language) {
    html += `<div class="insight-section">${sectionHeader('Plain Language Explanation','plain')}
      <div class="insight-content">${safe(a.plain_language)}</div></div>`;
  }

  // Key insights
  if (a.key_insights?.length) {
    html += `<div class="insight-section">${sectionHeader('Key Insights','insights')}
      <ul class="insight-list">${a.key_insights.map(i=>`
        <li class="insight-list-item">
          ${ic(ICONS.insights.replace('currentColor','var(--info)'))}
          <span>${safe(i)}</span>
        </li>`).join('')}
      </ul></div>`;
  }

  // Dates
  if (a.important_dates?.length) {
    html += `<div class="insight-section">${sectionHeader('Important Dates','dates')}
      <ul class="insight-list">${a.important_dates.map(d=>`
        <li class="insight-list-item date-item">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="${urgencyColor[d.urgency]||'var(--info)'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS.dates}</svg>
          <div><strong style="color:var(--text-primary)">${safe(d.date)}</strong> — ${safe(d.description)}</div>
        </li>`).join('')}
      </ul></div>`;
  }

  // Risks
  if (a.risks_detected?.length) {
    html += `<div class="insight-section">${sectionHeader('Risks Detected','risk')}
      <ul class="insight-list">${a.risks_detected.map(r=>`
        <li class="insight-list-item risk-item">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="${severityColor[r.severity]||'var(--text-muted)'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0">${ICONS.risk}</svg>
          <div>
            <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:${severityColor[r.severity]||'var(--text-muted)'};margin-bottom:3px">${r.severity||'unknown'} risk</div>
            <div>${safe(r.risk)}</div>
            ${r.mitigation ? `<div style="font-size:12px;color:var(--text-muted);margin-top:3px">Suggestion: ${safe(r.mitigation)}</div>` : ''}
          </div>
        </li>`).join('')}
      </ul></div>`;
  }

  // Obligations
  if (a.obligations?.length) {
    html += `<div class="insight-section">${sectionHeader('Obligations','obligations')}
      <ul class="insight-list">${a.obligations.map(o=>`
        <li class="insight-list-item">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="var(--warning)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS.obligations}</svg>
          <span>${safe(o)}</span>
        </li>`).join('')}
      </ul></div>`;
  }

  // Actions
  if (a.action_items?.length) {
    html += `<div class="insight-section">${sectionHeader('Action Items','actions')}
      <ul class="insight-list">${a.action_items.map(item=>`
        <li class="insight-list-item action-item">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="${priorityColor[item.priority]||'var(--success)'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS.actions}</svg>
          <div>
            <label><input class="action-complete" type="checkbox" data-action="${safe(item.action)}"> ${safe(item.action)}</label>
            <div style="font-size:12px;color:var(--text-muted);margin-top:2px">${item.deadline && item.deadline!=='none' ? `Deadline: ${safe(item.deadline)}` : 'No specific deadline'}</div>
          </div>
        </li>`).join('')}
      </ul></div>`;
  }

  return html || '<div style="color:var(--text-muted);font-size:14px;padding:var(--space-4)">No analysis data found.</div>';
};

// ── Chat ───────────────────────────────────────────────────────────────────────
const appendMsg = (role, content) => {
  const isUser = role === 'user';
  const el = document.createElement('div');
  el.className = `chat-msg ${role}`;
  const avatar = document.createElement('div');
  avatar.className = `chat-avatar${isUser ? '' : ' ai'}`;
  avatar.textContent = isUser ? 'You' : 'AI';
  const wrap = document.createElement('div');
  const bubble = document.createElement('div');
  bubble.className = 'chat-bubble';
  bubble.textContent = content;
  wrap.appendChild(bubble);
  if (isUser) { el.append(wrap, avatar); } else { el.append(avatar, wrap); }
  const container = document.getElementById('chat-messages');
  container.appendChild(el);
  container.scrollTop = container.scrollHeight;
  persistDocument();
};

const sendChat = async (question) => {
  const input   = document.getElementById('chat-input');
  const q       = (question || input?.value || '').trim();
  if (!q) return;
  if (input) { input.value = ''; input.style.height = 'auto'; }
  document.getElementById('chat-suggestions').innerHTML = '';

  appendMsg('user', q);
  chatHistory.push({ role:'user', content:q });

  // Thinking indicator
  const thinking = document.createElement('div');
  thinking.className = 'chat-msg ai';
  thinking.id = 'thinking';
  thinking.innerHTML = '<div class="chat-avatar ai">AI</div><div><div class="chat-bubble" style="color:var(--text-muted)"><span style="display:inline-block;animation:pulse 1.2s ease infinite">Thinking...</span></div></div>';
  document.getElementById('chat-messages').appendChild(thinking);
  document.getElementById('chat-messages').scrollTop = 99999;

  try {
    const context  = JSON.stringify(currentDoc?.analysis || {});
    const prompt   = `DOCUMENT: ${currentDoc?.name}\nANALYSIS CONTEXT:\n${context.slice(0,8000)}\n\nUser question: ${q}\n\nAnswer concisely, reference specific sections when relevant.`;
    const token    = QDAuth.getToken ? QDAuth.getToken() : null;

    const res = await fetch('/api/analyze', {
      method: 'POST',
      headers: { 'Content-Type':'application/json', ...(token ? {Authorization:`Bearer ${token}`} : {}) },
      body: JSON.stringify({ file_name: currentDoc?.name || 'document', file_type:'text/plain', text: prompt, pages:1, language:window.Norcanto?.getLanguage?.() || 'en' }),
    });

    const data = await res.json();
    thinking.remove();

    if (data.success && data.analysis?.executive_summary) {
      const reply = data.analysis.executive_summary;
      chatHistory.push({ role:'assistant', content:reply });
      appendMsg('ai', reply);
    } else {
      appendMsg('ai', data.error || 'Could not process your question. Please try again.');
    }
  } catch (err) {
    thinking?.remove();
    appendMsg('ai', 'Network error. Please check your connection and try again.');
  }
};

// ── Export ────────────────────────────────────────────────────────────────────
const exportAnalysis = () => {
  if (!currentDoc?.analysis) return;
  const a   = currentDoc.analysis;
  const txt = [
    `NORCANTO AI - DOCUMENT ANALYSIS REPORT`,
    `Document: ${currentDoc.name}`,
    `Analyzed: ${new Date(currentDoc.date).toLocaleDateString()}`,
    `${'─'.repeat(50)}`,
    `\nEXECUTIVE SUMMARY\n${a.executive_summary || 'N/A'}`,
    `\nPLAIN LANGUAGE\n${a.plain_language || 'N/A'}`,
    `\nKEY INSIGHTS\n${(a.key_insights||[]).map((i,n)=>`${n+1}. ${i}`).join('\n') || 'N/A'}`,
    `\nIMPORTANT DATES\n${(a.important_dates||[]).map(d=>`${d.date}: ${d.description} [${d.urgency}]`).join('\n') || 'None'}`,
    `\nRISKS DETECTED\n${(a.risks_detected||[]).map(r=>`[${(r.severity||'').toUpperCase()}] ${r.risk}`).join('\n') || 'None'}`,
    `\nOBLIGATIONS\n${(a.obligations||[]).join('\n') || 'None'}`,
    `\nACTION ITEMS\n${(a.action_items||[]).map(i=>`[${i.priority}] ${i.action} — ${i.deadline}`).join('\n') || 'None'}`,
    `\n${'─'.repeat(50)}\nGenerated by Norcanto AI — norcanto.com`,
  ].join('\n');

  const blob = new Blob([txt], {type:'text/plain'});
  const url  = URL.createObjectURL(blob);
  const a2   = document.createElement('a');
  a2.href    = url;
  a2.download = `${currentDoc.name.replace(/\.[^.]+$/,'')}-norcanto-analysis.txt`;
  a2.click();
  URL.revokeObjectURL(url);
};
const exportWord = () => {
  if(!currentDoc)return;
  const html=`<!doctype html><meta charset="utf-8"><title>${safe(currentDoc.name)}</title><h1>${safe(currentDoc.name)}</h1><pre style="white-space:pre-wrap;font-family:Arial">${safe(document.getElementById('analysis-sections').innerText)}</pre>`;
  const url=URL.createObjectURL(new Blob([html],{type:'application/msword'}));const link=document.createElement('a');link.href=url;link.download=`${currentDoc.name.replace(/\.[^.]+$/,'')}-analysis.doc`;link.click();URL.revokeObjectURL(url);
};

// ── Init ───────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  const docId = getDocId();

  if (!docId) {
    document.getElementById('loading-state').style.display = 'none';
    const err = document.getElementById('error-state');
    err.style.display = 'flex';
    document.getElementById('error-title').textContent = 'No document specified';
    document.getElementById('error-desc').textContent = 'Please go back to the dashboard and open a document.';
    return;
  }

  // Try loading immediately, then retry once after a short delay
  // (handles edge case where redirect was slightly faster than localStorage write)
  const tryLoad = async (attempt) => {
    currentDoc = loadDoc(docId);
    if (!currentDoc && QDAuth.getToken?.()) {
      try {
        const response=await QDAuth.authFetch('/api/documents'); const data=await response.json();
        const cloud=(data.documents||[]).find(doc=>doc.id===docId);
        if(cloud) currentDoc={id:cloud.id,name:cloud.title||cloud.file_name,originalName:cloud.file_name,ext:cloud.file_type,date:cloud.created_at,analysis:typeof cloud.analysis==='string'?JSON.parse(cloud.analysis):cloud.analysis,notes:cloud.metadata?.notes||'',chatHistory:cloud.metadata?.chatHistory||[],completedActions:cloud.metadata?.completedActions||[],storage:'cloud'};
      } catch {}
    }

    if (!currentDoc) {
      if (attempt < 3) {
        document.getElementById('loading-label').textContent = 'Loading analysis...';
        setTimeout(() => tryLoad(attempt + 1), 400);
        return;
      }
      // All retries failed
      document.getElementById('loading-state').style.display = 'none';
      const err = document.getElementById('error-state');
      err.style.display = 'flex';
      document.getElementById('error-title').textContent = 'Document not found';
      document.getElementById('error-desc').textContent = 'This document may have been deleted or the link is invalid. Return to the dashboard and upload again.';
      return;
    }

    // Document found — render
    document.getElementById('loading-state').style.display = 'none';
    document.getElementById('analysis-view').style.display = 'grid';

    document.title = `${currentDoc.name} — Norcanto AI`;
    document.getElementById('doc-name').textContent = currentDoc.name;
    document.getElementById('doc-meta').textContent = `Analyzed ${new Date(currentDoc.date).toLocaleDateString('en-US',{dateStyle:'long'})} · Norcanto AI`;

    const tagsEl = document.getElementById('doc-tags');
    if (currentDoc.analysis?.document_type)    tagsEl.innerHTML += `<span class="pill">${safe(currentDoc.analysis.document_type)}</span>`;
    if (currentDoc.analysis?.complexity_score) tagsEl.innerHTML += `<span class="pill">Complexity ${safe(currentDoc.analysis.complexity_score)}/10</span>`;
    if (currentDoc.analysis?.reading_time_minutes) tagsEl.innerHTML += `<span class="pill">${safe(currentDoc.analysis.reading_time_minutes)} min read</span>`;

    document.getElementById('analysis-sections').innerHTML = currentDoc.analysis
      ? renderAnalysis(currentDoc.analysis)
      : '<div style="color:var(--text-muted);font-size:14px;padding:var(--space-4)">No analysis data available for this document.</div>';

    const sections=[...document.querySelectorAll('#analysis-sections .insight-section')];
    const priority=['Risks Detected','Important Dates','Action Items'];
    priority.slice().reverse().forEach(title=>{
      const section=sections.find(s=>s.querySelector('.insight-section-title')?.textContent===title);
      if(section)document.getElementById('analysis-sections').prepend(section);
    });
    document.getElementById('analysis-toc').innerHTML=[...document.querySelectorAll('#analysis-sections .insight-section')].map((section,index)=>{
      const title=section.querySelector('.insight-section-title')?.textContent||`Section ${index+1}`;
      section.id=`analysis-section-${index}`;
      return `<a href="#${section.id}">${safe(title)}</a>`;
    }).join('');
    document.querySelectorAll('.collapse-section').forEach(button=>button.addEventListener('click',()=>{
      const section=button.closest('.insight-section');const collapsed=section.classList.toggle('collapsed');
      button.setAttribute('aria-expanded',String(!collapsed));
    }));
    document.querySelectorAll('.copy-section').forEach(button=>button.addEventListener('click',async()=>{
      const section=button.closest('.insight-section');await navigator.clipboard.writeText(section.innerText.replace('⧉⌃',''));window.Norcanto?.announce('Section copied');
    }));
    document.querySelectorAll('.action-complete').forEach(box=>{
      box.checked=(currentDoc.completedActions||[]).includes(box.dataset.action);
      box.addEventListener('change',()=>{const set=new Set(currentDoc.completedActions||[]);box.checked?set.add(box.dataset.action):set.delete(box.dataset.action);currentDoc.completedActions=[...set];persistDocument();});
    });
    document.getElementById('document-notes').value=currentDoc.notes||'';
    chatHistory=currentDoc.chatHistory||[];
    chatHistory.forEach(message=>appendMsg(message.role==='assistant'?'ai':'user',message.content));

    // Suggested questions in chat
    if (currentDoc.analysis?.recommended_questions?.length) {
      const sugg = document.getElementById('chat-suggestions');
      sugg.innerHTML = currentDoc.analysis.recommended_questions.slice(0,3)
        .map(q=>`<button class="chat-suggestion" data-question="${safe(q)}">${safe(q)}</button>`).join('');
    }
    document.querySelectorAll('.chat-suggestion[data-question]').forEach(button=>button.addEventListener('click',()=>sendChat(button.dataset.question)));

    document.getElementById('export-btn').style.display = 'flex';
  };

  tryLoad(0);

  // Export
  document.getElementById('export-btn')?.addEventListener('click', exportAnalysis);

  // Chat
  document.getElementById('chat-send')?.addEventListener('click', () => sendChat());
  document.getElementById('chat-input')?.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
  });
  document.getElementById('chat-input')?.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 110) + 'px';
  });
  document.getElementById('document-notes')?.addEventListener('change',persistDocument);
  document.getElementById('rename-btn')?.addEventListener('click',async()=>{
    const title=prompt('Document title',currentDoc?.name||'');
    if(title?.trim()){currentDoc.name=title.trim();document.getElementById('doc-name').textContent=currentDoc.name;await persistDocument();}
  });
  document.getElementById('copy-report-btn')?.addEventListener('click',async()=>{
    await navigator.clipboard.writeText(document.getElementById('analysis-sections').innerText);window.Norcanto?.announce('Report copied');
  });
  document.getElementById('pdf-export-btn')?.addEventListener('click',()=>window.print());
  document.getElementById('word-export-btn')?.addEventListener('click',exportWord);
  document.getElementById('share-btn')?.addEventListener('click',async()=>{
    await navigator.clipboard.writeText(location.href);window.Norcanto?.announce(currentDoc?.storage==='cloud'?'Authenticated link copied':'Local-only link copied; it works in this browser only');
  });
  document.getElementById('show-analysis-tab')?.addEventListener('click',()=>{
    document.getElementById('analysis-view').className='analysis-layout mobile-analysis';
    document.getElementById('show-analysis-tab').classList.add('active');document.getElementById('show-chat-tab').classList.remove('active');
  });
  document.getElementById('show-chat-tab')?.addEventListener('click',()=>{
    document.getElementById('analysis-view').className='analysis-layout mobile-chat';
    document.getElementById('show-chat-tab').classList.add('active');document.getElementById('show-analysis-tab').classList.remove('active');
  });
});
</script>
<style>.hide-xs { } @media(max-width:420px){.hide-xs{display:none}}</style>
<script src="/js/app-shell.js"></script>
</body>
</html>
