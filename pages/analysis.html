<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analysis - Norcanto AI</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/assets/norcanto_logo.png">
  <link rel="stylesheet" href="/css/design-system.css">
  <link rel="stylesheet" href="/css/nav.css">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/subscription.css">
</head>
<body>

<nav class="nav scrolled" id="main-nav">
  <div class="nav-inner">
    <a href="/pages/app.html" class="nav-logo" style="gap:var(--space-2)">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16" style="color:var(--text-muted)"><polyline points="15 18 9 12 15 6"/></svg>
      <div class="nav-logo-icon"><img src="/assets/norcanto_logo.png" alt="Norcanto" width="28" height="28"></div>
      <div class="nav-logo-wordmark" style="font-size:14px">Norcanto AI</div>
    </a>
    <div style="flex:1"></div>
    <div class="nav-actions" style="gap:var(--space-2)">
      <button class="btn btn-ghost btn-sm" id="export-btn" style="display:none">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="13" height="13"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Export
      </button>
      <button class="btn btn-secondary btn-sm" onclick="window.location.href='/pages/app.html'">
        Dashboard
      </button>
    </div>
  </div>
</nav>

<div class="app-layout" style="padding-top:var(--nav-height)">
  <div class="main-content" style="margin-left:0">

    <!-- Loading state -->
    <div id="loading-state" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - var(--nav-height));gap:var(--space-4)">
      <div style="width:48px;height:48px;border:3px solid var(--brand-border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite"></div>
      <div style="font-size:14px;color:var(--text-secondary)" id="loading-label">Loading analysis...</div>
    </div>

    <!-- Analysis layout (shown after load) -->
    <div class="analysis-layout" id="analysis-view" style="display:none">

      <!-- Main analysis panel -->
      <div class="analysis-main" id="analysis-main">

        <!-- Header -->
        <div class="analysis-header">
          <div class="analysis-doc-info">
            <div class="analysis-doc-icon">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            </div>
            <div>
              <div class="analysis-doc-name" id="doc-name">Document</div>
              <div class="analysis-doc-meta" id="doc-meta">Analyzed by Norcanto AI</div>
            </div>
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:var(--space-2)" id="doc-tags"></div>
        </div>

        <!-- Sections -->
        <div id="analysis-sections"></div>
      </div>

      <!-- Chat sidebar -->
      <div class="analysis-sidebar">
        <div class="chat-header">
          <div style="width:28px;height:28px;border-radius:7px;background:var(--accent);display:flex;align-items:center;justify-content:center;">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="var(--brand-black)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="13" height="13"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          </div>
          <div class="chat-title">Ask the Document</div>
        </div>

        <div class="chat-messages" id="chat-messages">
          <div class="chat-msg ai">
            <div class="chat-avatar ai">AI</div>
            <div>
              <div class="chat-bubble">I have analyzed this document. Ask me anything about its content, obligations, risks, or any specific section.</div>
            </div>
          </div>
        </div>

        <div class="chat-input-area">
          <div class="chat-suggestions" id="chat-suggestions"></div>
          <div class="chat-input-row">
            <textarea id="chat-input" placeholder="Ask a question about this document..." rows="1" aria-label="Chat message"></textarea>
            <button class="chat-send-btn" id="chat-send" aria-label="Send message">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
          </div>
          <div style="font-size:11px;color:var(--text-muted);margin-top:var(--space-2);text-align:center" id="chat-limit-label"></div>
        </div>
      </div>
    </div>

    <!-- Error state -->
    <div id="error-state" style="display:none;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - var(--nav-height));gap:var(--space-4);text-align:center;padding:var(--space-8)">
      <div class="empty-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div>
      <div class="empty-title" id="error-title">Document not found</div>
      <div class="empty-desc" id="error-desc">This document may have been deleted.</div>
      <a href="/pages/app.html" class="btn btn-primary">Back to Dashboard</a>
    </div>

  </div>
</div>

<script src="/js/main.js"></script>
<script src="/js/auth.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const docId = params.get('id');
const STORAGE_KEY = 'qd_documents';

let currentDoc = null;
let chatHistory = [];
let docText = '';

const loadDoc = () => {
  try {
    const docs = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    return docs.find(d => d.id === docId) || null;
  } catch { return null; }
};

const sectionIcon = (type) => {
  const icons = {
    summary: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>',
    plain: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
    insights: '<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>',
    risks: '<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>',
    dates: '<rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>',
    obligations: '<polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
    actions: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
    questions: '<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/>',
  };
  return icons[type] || icons.summary;
};

const severityColor = (s) => ({ high: 'var(--danger)', medium: 'var(--warning)', low: 'var(--success)' })[s] || 'var(--text-muted)';
const priorityColor = (p) => ({ high: 'var(--danger)', medium: 'var(--warning)', low: 'var(--success)' })[p] || 'var(--text-muted)';
const urgencyColor = (u) => ({ high: 'var(--danger)', medium: 'var(--warning)', low: 'var(--info)' })[u] || 'var(--text-muted)';

const buildSectionHeader = (title, iconPath) => `
  <div class="insight-section-header">
    <div class="insight-section-icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${iconPath}</svg>
    </div>
    <div class="insight-section-title">${title}</div>
  </div>
`;

const renderAnalysis = (a, planId) => {
  const hasPremium = ['trial','premium','pro'].includes(planId);
  let html = '';

  // Executive summary
  html += `<div class="insight-section">
    ${buildSectionHeader('Executive Summary', sectionIcon('summary'))}
    <div class="insight-content">${a.executive_summary || 'No summary available.'}</div>
  </div>`;

  // Plain language
  html += `<div class="insight-section">
    ${buildSectionHeader('Plain Language Explanation', sectionIcon('plain'))}
    <div class="insight-content">${a.plain_language || ''}</div>
  </div>`;

  // Key insights
  if (a.key_insights?.length) {
    html += `<div class="insight-section">
      ${buildSectionHeader('Key Insights', sectionIcon('insights'))}
      <ul class="insight-list">${a.key_insights.map(i => `
        <li class="insight-list-item">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="var(--info)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          <span>${i}</span>
        </li>`).join('')}
      </ul>
    </div>`;
  }

  // Important dates
  if (a.important_dates?.length) {
    html += `<div class="insight-section">
      ${buildSectionHeader('Important Dates', sectionIcon('dates'))}
      <ul class="insight-list">${a.important_dates.map(d => `
        <li class="insight-list-item date-item">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="${urgencyColor(d.urgency)}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span><strong style="color:var(--text-primary)">${d.date}</strong> — ${d.description}</span>
        </li>`).join('')}
      </ul>
    </div>`;
  }

  // Risks (premium)
  if (a.risks_detected?.length) {
    const isLocked = !hasPremium && a.risks_detected[0]?.severity === 'locked';
    html += `<div class="insight-section">
      ${buildSectionHeader('Risks Detected', sectionIcon('risks'))}
      ${isLocked ? `
        <div class="upgrade-prompt">
          <div class="upgrade-prompt-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
          <div class="upgrade-prompt-title">Risk Detection requires Premium</div>
          <div class="upgrade-prompt-desc">Upgrade to see all detected risks, their severity, and mitigation suggestions.</div>
          <a href="/pages/pricing.html" class="btn btn-primary btn-sm">Upgrade to Premium</a>
        </div>
      ` : `<ul class="insight-list">${a.risks_detected.map(r => `
        <li class="insight-list-item risk-item">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="${severityColor(r.severity)}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          <div>
            <div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:${severityColor(r.severity)};margin-bottom:3px">${r.severity} risk</div>
            <div>${r.risk}</div>
            ${r.mitigation ? `<div style="font-size:12px;color:var(--text-muted);margin-top:4px">Suggestion: ${r.mitigation}</div>` : ''}
          </div>
        </li>`).join('')}
      </ul>`}
    </div>`;
  }

  // Obligations
  if (a.obligations?.length) {
    html += `<div class="insight-section">
      ${buildSectionHeader('Obligations', sectionIcon('obligations'))}
      <ul class="insight-list">${a.obligations.map(o => `
        <li class="insight-list-item">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="var(--warning)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          <span>${o}</span>
        </li>`).join('')}
      </ul>
    </div>`;
  }

  // Action items (premium)
  if (a.action_items?.length) {
    const isLocked = !hasPremium && a.action_items[0]?.priority === 'locked';
    html += `<div class="insight-section">
      ${buildSectionHeader('Action Items', sectionIcon('actions'))}
      ${isLocked ? `
        <div class="upgrade-prompt">
          <div class="upgrade-prompt-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
          <div class="upgrade-prompt-title">Action Items requires Premium</div>
          <div class="upgrade-prompt-desc">Upgrade to see all required actions, priorities, and deadlines.</div>
          <a href="/pages/pricing.html" class="btn btn-primary btn-sm">Upgrade to Premium</a>
        </div>
      ` : `<ul class="insight-list">${a.action_items.map(item => `
        <li class="insight-list-item action-item">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="${priorityColor(item.priority)}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <div>
            <div>${item.action}</div>
            <div style="font-size:12px;color:var(--text-muted);margin-top:3px">${item.deadline && item.deadline !== 'none' ? `Deadline: ${item.deadline}` : 'No specific deadline'}</div>
          </div>
        </li>`).join('')}
      </ul>`}
    </div>`;
  }

  // Recommended questions
  if (a.recommended_questions?.length) {
    html += `<div class="insight-section">
      ${buildSectionHeader('Recommended Questions', sectionIcon('questions'))}
      <div style="display:flex;flex-direction:column;gap:var(--space-2)">
        ${a.recommended_questions.map(q => `
          <button class="chat-suggestion" onclick="sendSuggestion(${JSON.stringify(q)})">${q}</button>
        `).join('')}
      </div>
    </div>`;
  }

  return html;
};

// ── Chat ───────────────────────────────────────────────────────────────────────
const appendMessage = (role, content, source = null) => {
  const container = document.getElementById('chat-messages');
  const isUser = role === 'user';
  const div = document.createElement('div');
  div.className = `chat-msg ${role}`;
  div.innerHTML = `
    ${!isUser ? '<div class="chat-avatar ai">AI</div>' : ''}
    <div>
      <div class="chat-bubble">${content.replace(/\n/g, '<br>')}</div>
      ${source ? `<div class="chat-source"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg>${source}</div>` : ''}
    </div>
    ${isUser ? '<div class="chat-avatar">You</div>' : ''}
  `;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
};

const sendSuggestion = (q) => {
  document.getElementById('chat-input').value = q;
  sendChat();
};

const sendChat = async () => {
  const input = document.getElementById('chat-input');
  const q = input.value.trim();
  if (!q || !currentDoc) return;

  input.value = '';
  input.style.height = 'auto';
  document.getElementById('chat-suggestions').innerHTML = '';

  appendMessage('user', q);
  chatHistory.push({ role: 'user', content: q });

  const planId = QDAuth.getPlanId();
  const limits = { free: 10, trial: 30, premium: 100, pro: -1 };
  const limit = limits[planId] || 10;
  if (limit !== -1 && chatHistory.filter(m => m.role === 'user').length > limit) {
    appendMessage('ai', `You have reached the chat limit for your current plan (${limit} messages). Upgrade to continue chatting.`);
    return;
  }

  // Thinking indicator
  const thinkDiv = document.createElement('div');
  thinkDiv.className = 'chat-msg ai'; thinkDiv.id = 'thinking';
  thinkDiv.innerHTML = '<div class="chat-avatar ai">AI</div><div class="chat-bubble" style="color:var(--text-muted)">Thinking...</div>';
  document.getElementById('chat-messages').appendChild(thinkDiv);
  document.getElementById('chat-messages').scrollTop = 99999;

  try {
    const token = QDAuth.getToken();
    // Use the analysis as context for server-side chat
    const context = JSON.stringify(currentDoc.analysis || {});
    const res = await fetch('/api/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: `Bearer ${token}` } : {}) },
      body: JSON.stringify({
        file_name: currentDoc.name,
        file_type: 'chat',
        text: `DOCUMENT ANALYSIS CONTEXT:\n${context}\n\nUser question: ${q}\n\nAnswer based on the document analysis above. Be concise, reference specific sections when possible.`,
        pages: 1,
        is_chat: true,
      }),
    });
    const data = await res.json();
    thinkDiv.remove();
    if (data.success && data.analysis?.executive_summary) {
      const reply = data.analysis.executive_summary;
      chatHistory.push({ role: 'assistant', content: reply });
      appendMessage('ai', reply);
    } else if (!data.success) {
      appendMessage('ai', data.error || 'Could not process your question. Please try again.');
    }
  } catch (err) {
    thinkDiv.remove();
    appendMessage('ai', 'Network error. Please check your connection and try again.');
  }
};

// ── Init ───────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  if (!docId) { showError('No document specified'); return; }

  currentDoc = loadDoc();
  if (!currentDoc) { showError('Document not found', 'This document may have been deleted or the link is invalid.'); return; }

  document.getElementById('loading-label').textContent = 'Loading analysis...';

  setTimeout(() => {
    document.getElementById('loading-state').style.display = 'none';
    document.getElementById('analysis-view').style.display = 'grid';

    document.getElementById('doc-name').textContent = currentDoc.name;
    document.getElementById('doc-meta').textContent = `Analyzed ${new Date(currentDoc.date).toLocaleDateString('en-US', { dateStyle: 'long' })} by Norcanto AI`;
    document.title = `${currentDoc.name} - Norcanto AI`;

    const tagsEl = document.getElementById('doc-tags');
    if (currentDoc.analysis?.document_type) tagsEl.innerHTML = `<span class="pill">${currentDoc.analysis.document_type}</span>`;
    if (currentDoc.analysis?.complexity_score) tagsEl.innerHTML += `<span class="pill">Complexity ${currentDoc.analysis.complexity_score}/10</span>`;
    if (currentDoc.analysis?.reading_time_minutes) tagsEl.innerHTML += `<span class="pill">${currentDoc.analysis.reading_time_minutes} min read</span>`;

    const planId = QDAuth.getPlanId();
    const sections = document.getElementById('analysis-sections');
    if (currentDoc.analysis) {
      sections.innerHTML = renderAnalysis(currentDoc.analysis, planId);
    } else {
      sections.innerHTML = '<div style="color:var(--text-muted);font-size:14px;padding:var(--space-6)">No analysis available for this document.</div>';
    }

    // Suggested questions
    if (currentDoc.analysis?.recommended_questions?.length) {
      const sugg = document.getElementById('chat-suggestions');
      sugg.innerHTML = currentDoc.analysis.recommended_questions.slice(0, 3).map(q =>
        `<button class="chat-suggestion" onclick="sendSuggestion(${JSON.stringify(q)})">${q}</button>`
      ).join('');
    }

    const hasPremium = ['trial','premium','pro'].includes(planId);
    if (hasPremium) {
      document.getElementById('export-btn').style.display = 'flex';
    }

    const limits = { free: 10, trial: 30, premium: 100, pro: -1 };
    const lim = limits[planId] || 10;
    const limitLabel = document.getElementById('chat-limit-label');
    if (limitLabel && lim !== -1) limitLabel.textContent = `${lim} messages per document on your plan`;
  }, 400);
});

const showError = (title = 'Error', desc = '') => {
  document.getElementById('loading-state').style.display = 'none';
  const errEl = document.getElementById('error-state');
  errEl.style.display = 'flex';
  document.getElementById('error-title').textContent = title;
  if (desc) document.getElementById('error-desc').textContent = desc;
};

// Chat send
document.getElementById('chat-send')?.addEventListener('click', sendChat);
document.getElementById('chat-input')?.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
});
document.getElementById('chat-input')?.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

// Export
document.getElementById('export-btn')?.addEventListener('click', () => {
  if (!currentDoc?.analysis) return;
  const a = currentDoc.analysis;
  const txt = [
    `NORCANTO AI - DOCUMENT ANALYSIS REPORT`,
    `Document: ${currentDoc.name}`,
    `Analyzed: ${new Date(currentDoc.date).toLocaleDateString()}`,
    `\n--- EXECUTIVE SUMMARY ---\n${a.executive_summary}`,
    `\n--- PLAIN LANGUAGE ---\n${a.plain_language}`,
    `\n--- KEY INSIGHTS ---\n${(a.key_insights||[]).map((i,n) => `${n+1}. ${i}`).join('\n')}`,
    `\n--- IMPORTANT DATES ---\n${(a.important_dates||[]).map(d => `${d.date}: ${d.description}`).join('\n')}`,
    `\n--- RISKS DETECTED ---\n${(a.risks_detected||[]).map(r => `[${r.severity?.toUpperCase()}] ${r.risk}`).join('\n')}`,
    `\n--- OBLIGATIONS ---\n${(a.obligations||[]).join('\n')}`,
    `\n--- ACTION ITEMS ---\n${(a.action_items||[]).map(i => `[${i.priority}] ${i.action} (${i.deadline})`).join('\n')}`,
  ].join('\n');
  const blob = new Blob([txt], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url; link.download = `${currentDoc.name.replace(/\.[^.]+$/, '')}-analysis.txt`;
  link.click(); URL.revokeObjectURL(url);
});
</script>
</body>
</html>
