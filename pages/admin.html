<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Norcanto AI</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/assets/norcanto_logo.png">
  <link rel="stylesheet" href="/css/design-system.css">
  <link rel="stylesheet" href="/css/nav.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>

<nav class="nav scrolled" id="main-nav">
  <div class="nav-inner">
    <a href="/" class="nav-logo">
      <div class="nav-logo-icon"><img src="/assets/norcanto_logo.png" alt="Norcanto" width="32" height="32"></div>
      <div class="nav-logo-wordmark">Norcanto AI <span class="nav-logo-sub">Admin</span></div>
    </a>
    <div style="flex:1"></div>
    <div class="nav-actions">
      <a href="/pages/app.html" class="btn btn-ghost btn-sm">Dashboard</a>
      <button onclick="QDAuth.logout()" class="btn btn-secondary btn-sm">Sign out</button>
    </div>
  </div>
</nav>

<div class="admin-layout">
  <!-- Admin sidebar -->
  <aside class="admin-sidebar">
    <div style="font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-muted);margin-bottom:var(--space-3);padding:0 var(--space-2)">Admin</div>
    <nav>
      <button class="admin-nav-item active" onclick="showSection('overview')">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Overview
      </button>
      <button class="admin-nav-item" onclick="showSection('users')">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Users
      </button>

      <button class="admin-nav-item" onclick="showSection('payments')">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        Payments
      </button>
    </nav>
  </aside>

  <!-- Admin main -->
  <main class="admin-main" style="padding-top:calc(var(--nav-height) + var(--space-8))">

    <!-- Access check -->
    <div id="admin-access-denied" style="display:none;text-align:center;padding:var(--space-16)">
      <div class="empty-icon" style="margin:0 auto var(--space-4)"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
      <div class="empty-title">Admin Access Required</div>
      <div class="empty-desc">Your account does not have admin privileges.</div>
      <a href="/pages/app.html" class="btn btn-primary" style="margin-top:var(--space-4)">Go to Dashboard</a>
    </div>

    <!-- Loading -->
    <div id="admin-loading" style="text-align:center;padding:var(--space-16)">
      <div style="width:40px;height:40px;border:3px solid var(--brand-border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto var(--space-4)"></div>
      <div style="font-size:14px;color:var(--text-secondary)">Loading admin data...</div>
    </div>

    <!-- Overview -->
    <div id="section-overview" class="admin-section" style="display:none">
      <h1 style="font-family:var(--font-display);font-size:26px;font-weight:700;color:var(--text-primary);letter-spacing:-0.02em;margin-bottom:var(--space-8)">Overview</h1>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:var(--space-4);margin-bottom:var(--space-8)">
        <div class="stat-card"><div class="stat-value" id="stat-total-users">-</div><div class="stat-label">Total Users</div></div>
        <div class="stat-card"><div class="stat-value" id="stat-total-docs">-</div><div class="stat-label">Total Analyses</div></div>
        <div class="stat-card"><div class="stat-value" id="stat-today-docs">-</div><div class="stat-label">Analyses Today</div></div>
        <div class="stat-card"><div class="stat-value" id="stat-revenue" style="display:none">-</div><div class="stat-label" style="display:none">Revenue</div></div>
        <div class="stat-card"><div class="stat-value" id="stat-failed" style="display:none">-</div><div class="stat-label" style="display:none">Failed</div></div>
      </div>
      <div style="background:var(--brand-charcoal);border:1px solid var(--brand-border);border-radius:var(--radius-lg);padding:var(--space-5)">
        <div style="font-size:14px;font-weight:600;color:var(--text-primary);margin-bottom:var(--space-4)">Recent Signups</div>
        <div id="recent-users-table"></div>
      </div>
    </div>

    <!-- Users -->
    <div id="section-users" class="admin-section" style="display:none">
      <h1 style="font-family:var(--font-display);font-size:26px;font-weight:700;color:var(--text-primary);letter-spacing:-0.02em;margin-bottom:var(--space-8)">Users</h1>
      <div style="background:var(--brand-charcoal);border:1px solid var(--brand-border);border-radius:var(--radius-lg);padding:var(--space-5);overflow-x:auto">
        <div id="users-table"></div>
      </div>
    </div>



    <!-- Payments -->
    <div id="section-payments" class="admin-section" style="display:none">
      <h1 style="font-family:var(--font-display);font-size:26px;font-weight:700;color:var(--text-primary);letter-spacing:-0.02em;margin-bottom:var(--space-8)">Payments</h1>
      <div style="background:var(--brand-charcoal);border:1px solid var(--brand-border);border-radius:var(--radius-lg);padding:var(--space-5);overflow-x:auto">
        <div id="payments-table"></div>
      </div>
    </div>

  </main>
</div>

<script src="/js/main.js"></script>
<script src="/js/auth.js"></script>
<script>
let adminData = null;

const showSection = (name) => {
  document.querySelectorAll('.admin-section').forEach(s => s.style.display = 'none');
  document.querySelectorAll('.admin-nav-item').forEach(b => b.classList.remove('active'));
  const sec = document.getElementById(`section-${name}`);
  if (sec) sec.style.display = 'block';
  event?.currentTarget?.classList.add('active');
};

const fmt = (v) => v === null || v === undefined ? '-' : v;
const fmtDate = (d) => d ? new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: '2-digit' }) : '-';
const fmtMoney = (cents) => cents ? `${(cents / 100).toFixed(2)} XAF` : '0 XAF';
const statusPill = (s) => {
  const colors = { active: '#4ADE80', trialing: '#60A5FA', expired: '#F87171', cancelled: '#F87171', succeeded: '#4ADE80', failed: '#F87171', pending: '#FCD34D', free: '#888' };
  return `<span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:rgba(0,0,0,0.3);color:${colors[s]||'#888'}">${s}</span>`;
};

const buildTable = (cols, rows, emptyMsg = 'No data') => {
  if (!rows?.length) return `<div style="font-size:13px;color:var(--text-muted);padding:var(--space-4)">${emptyMsg}</div>`;
  return `<table class="data-table">
    <thead><tr>${cols.map(c => `<th>${c.label}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r => `<tr>${cols.map(c => `<td>${c.render ? c.render(r) : fmt(r[c.key])}</td>`).join('')}</tr>`).join('')}</tbody>
  </table>`;
};

const renderAdmin = (data) => {
  const { stats, users, analyses } = data;
  document.getElementById('stat-total-users').textContent = stats.total_users;
  const docsEl = document.getElementById('stat-total-docs');
  if (docsEl) docsEl.textContent = stats.total_analyses;
  const todayEl = document.getElementById('stat-today-docs');
  if (todayEl) todayEl.textContent = stats.analyses_today;

  document.getElementById('recent-users-table').innerHTML = buildTable([
    { label: 'Name', key: 'name' },
    { label: 'Email', key: 'email' },
    { label: 'Role', key: 'role' },
    { label: 'Joined', key: 'created_at', render: r => fmtDate(r.created_at) },
  ], (users || []).slice(0, 10), 'No users yet');

  document.getElementById('users-table').innerHTML = buildTable([
    { label: 'Name', key: 'name' },
    { label: 'Email', key: 'email' },
    { label: 'Role', key: 'role' },
    { label: 'Joined', key: 'created_at', render: r => fmtDate(r.created_at) },
  ], users, 'No users yet');

  const subsTable = document.getElementById('subs-table');
  if (subsTable) subsTable.innerHTML = buildTable([
    { label: 'User', key: 'user_id', render: r => { const u=(users||[]).find(u=>u.id===r.user_id); return u?u.email:r.user_id?.slice(0,8); }},
    { label: 'File', key: 'file_name' },
    { label: 'Type', key: 'file_type' },
    { label: 'Date', key: 'created_at', render: r => fmtDate(r.created_at) },
  ], analyses, 'No analyses yet');

  const paymentsTable = document.getElementById('payments-table');
  if (paymentsTable) paymentsTable.innerHTML = '<div style="font-size:13px;color:var(--text-muted);padding:var(--space-4)">Payments not enabled on this plan.</div>';
};

document.addEventListener('DOMContentLoaded', async () => {
  if (!QDAuth.isLoggedIn()) { window.location.href = '/pages/signin.html'; return; }
  const user = QDAuth.getUser();
  if (user?.role !== 'admin') {
    document.getElementById('admin-loading').style.display = 'none';
    document.getElementById('admin-access-denied').style.display = 'block';
    return;
  }

  try {
    const res = await QDAuth.authFetch('/api/admin/stats');
    const data = await res.json();
    document.getElementById('admin-loading').style.display = 'none';
    if (data.success) {
      adminData = data;
      renderAdmin(data);
      showSection('overview');
      document.getElementById('section-overview').style.display = 'block';
    } else {
      document.getElementById('admin-loading').innerHTML = `<div style="color:var(--danger);font-size:14px">${data.error || 'Failed to load admin data'}</div>`;
    }
  } catch (err) {
    document.getElementById('admin-loading').innerHTML = `<div style="color:var(--danger);font-size:14px">Could not connect to admin API. Check your server configuration.</div>`;
  }
});
</script>
</body>
</html>
