<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Password Help - Norcanto AI</title><meta name="robots" content="noindex">
<link rel="stylesheet" href="/css/design-system.css"><link rel="stylesheet" href="/css/nav.css">
</head><body>
<nav class="nav"><div class="nav-inner"><a href="/" class="nav-logo"><div class="nav-logo-icon"><img src="/assets/norcanto_logo.png" alt="Norcanto"></div><div class="nav-logo-wordmark">Norcanto AI</div></a><div class="nav-actions"><a class="btn btn-ghost" href="/pages/signin.html">Sign in</a></div></div></nav>
<main class="auth-page"><section class="auth-card"><h1 class="auth-title">Password help</h1><p class="auth-subtitle">Enter your account email. We will send secure next-step instructions if the account exists.</p>
<form id="forgot-form"><label class="form-label" for="email">Email address</label><input class="form-input" id="email" type="email" autocomplete="email" required>
<button class="btn btn-primary form-btn" style="margin-top:16px">Send instructions</button></form><p id="result" class="auth-footer" role="status"></p></section></main>
<script src="/js/auth.js"></script><script>
document.getElementById('forgot-form').addEventListener('submit',async(e)=>{e.preventDefault();const r=await fetch('/api/auth/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value})});const d=await r.json();document.getElementById('result').textContent=d.message||d.error||'Please try again.';});
</script><script src="/js/app-shell.js"></script>
</body></html>
